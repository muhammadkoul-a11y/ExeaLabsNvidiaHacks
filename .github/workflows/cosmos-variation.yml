name: Cosmos variation checks

on:
  push:
    branches:
      - feat/cosmos-transfer-nim
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  variation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,lint]"
      - name: Check for Python errors
        run: ruff check arrival/render/variation.py tests/test_variation.py
      - name: Test appearance variation
        env:
          ARRIVAL_DOTENV: "0"
        run: python -m pytest -q tests/test_variation.py
